<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d9c9ae" />
  <meta name="description" content="A handmade, interactive pop-up birthday card for Dad." />
  <title>For Dad — A Little Paper Celebration</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="scene">
    <header class="masthead">
      <span class="tiny-star" aria-hidden="true">✳</span>
      <p>A LITTLE PAPER CELEBRATION</p>
      <span class="tiny-star" aria-hidden="true">✳</span>
    </header>

    <section class="card-area" aria-label="Interactive birthday card">
      <div class="card-shadow" aria-hidden="true"></div>
      <button class="card" id="card" type="button" aria-expanded="false" aria-label="Open the birthday card">
        <div class="inside">
          <section class="inside-left" aria-label="Birthday message">
            <div class="inside-left-inner">
              <div class="little-stamp">✿ <span>FAMILY<br />TIME</span> ✿</div>
              <p class="eyebrow">TO OUR FAVORITE PERSON</p>
              <h1>Happy<br /><i>Birthday,</i><br />Dad!</h1>
              <div class="hand-rule"><span></span><b>♥</b><span></span></div>
              <p class="note">Thank you for being our steady place, our biggest laugh, and the heart of so many of our favorite memories.</p>
              <p class="note note-script">We love you so much.</p>
              <div class="signoff">ALL MY LOVE <span>♡</span></div>
            </div>
          </section>

          <section class="inside-right" aria-label="Pop-up birthday scene">
            <div class="garland" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="inside-title"><span>THE BIG DAY</span><span class="tiny-heart">♥</span></div>
            <div class="pop-stage" aria-hidden="true">
              <div class="photo-memory">
                <span class="memory-label">A LITTLE THROWBACK</span>
                <div class="photo-mat"><img src="./assets/family-photo.jpeg" alt="A treasured childhood family photograph" /></div>
                <span class="photo-caption">our story, still unfolding</span>
              </div>

              <div class="balloon balloon-one"><i></i></div>
              <div class="balloon balloon-two"><i></i></div>
              <div class="sparkle sparkle-a">✦</div><div class="sparkle sparkle-b">✧</div>

              <div class="people-pop">
                <div class="paper-person person-one">
                  <div class="person-hair hair-one"></div><div class="person-head head-one"><span class="eye e1"></span><span class="eye e2"></span><span class="smile"></span></div>
                  <div class="person-body body-one"><span class="collar"></span><span class="button"></span></div>
                  <div class="person-arm arm-one"></div><div class="person-arm arm-one-b"></div>
                </div>
                <div class="paper-person person-dad">
                  <div class="party-hat"><span class="hat-pom"></span><i></i><i></i><i></i></div>
                  <div class="person-hair hair-dad"></div><div class="person-head head-dad"><span class="eye e1"></span><span class="eye e2"></span><span class="smile"></span></div>
                  <div class="person-body body-dad"><span class="collar"></span><span class="tie"></span></div>
                  <div class="person-arm arm-dad"></div><div class="person-arm arm-dad-b"></div>
                </div>
                <div class="paper-person person-two">
                  <div class="person-hair hair-two"></div><div class="person-head head-two"><span class="eye e1"></span><span class="eye e2"></span><span class="smile"></span></div>
                  <div class="person-body body-two"><span class="collar"></span><span class="button"></span></div>
                  <div class="person-arm arm-two"></div><div class="person-arm arm-two-b"></div>
                </div>
                <div class="arm-link"></div>
              </div>

              <div class="banner"><span>HAPPY</span><span>BIRTHDAY!</span></div>
              <div class="cake-wrap">
                <div class="cake-candles"><i></i><i></i><i></i><i></i><i></i></div>
                <div class="cake-top"></div><div class="cake-body"><span>♥ &nbsp; ♥ &nbsp; ♥</span></div><div class="cake-plate"></div>
              </div>
              <div class="paper-floor"></div>
              <div class="support support-left"></div><div class="support support-right"></div>
            </div>
            <div class="inside-footer"><span>MADE WITH LOVE</span><span class="footer-star">✦</span><span>JUST FOR YOU</span></div>
          </section>
        </div>

        <div class="cover cover-left">
          <div class="cover-paper"></div>
          <div class="cut-edge left-edge"></div>
          <div class="cover-topline"><span>✦</span><span>AN EXTRA SPECIAL DAY</span><span>✦</span></div>
          <div class="cover-title"><span class="letter l1">H</span><span class="letter l2">A</span><span class="letter l3">P</span><span class="letter l4">P</span><span class="letter l5">Y</span></div>
          <div class="cover-bottom"><span class="sticker-star">✦</span><span class="cover-small">OPEN FOR A<br />LITTLE SURPRISE</span></div>
          <div class="hinge-shadow"></div>
        </div>
        <div class="cover cover-right">
          <div class="cover-paper"></div>
          <div class="cut-edge right-edge"></div>
          <div class="cover-topline"><span>✦</span><span>MADE JUST FOR YOU</span><span>✦</span></div>
          <div class="cover-title birthday-word"><span class="letter l6">B</span><span class="letter l7">I</span><span class="letter l8">R</span><span class="letter l9">T</span><span class="letter l10">H</span><span class="letter l11">D</span><span class="letter l12">A</span><span class="letter l13">Y</span></div>
          <div class="dad-address"><span class="address-heart">♥</span><span class="address-to">To Dear Dad</span><strong>Partrick Zhang</strong><span class="address-dash"></span><span class="address-note">your day, your way</span></div>
          <div class="cover-decor decor-1">✦</div><div class="cover-decor decor-2">✳</div><div class="cover-decor decor-3">✦</div>
          <div class="cover-instruction"><span>CLICK TO OPEN</span><b>↘</b></div>
          <div class="hinge-shadow"></div>
        </div>
      </button>
    </section>

    <div class="controls">
      <button class="open-button" id="open-button" type="button"><span class="button-icon">↗</span><span>Open the card</span></button>
      <p id="hint" class="hint">Tap the card to open your surprise</p>
      <p class="small-note">A tiny celebration, folded with love <span>✦</span></p>
    </div>

    <div class="confetti" id="confetti" aria-hidden="true"></div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
